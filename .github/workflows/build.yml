name: Build

on:
  push:
  workflow_dispatch:

env:
  LATEST_PAPER_API: 26.3.build.239-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin (1.20.6 API, runs on 1.20.5+)
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: ShrinkRay
          path: target/ShrinkRay-*.jar
      - name: Export jar
        run: |
          echo "JARB64:$(base64 -w0 target/ShrinkRay-1.2.0.jar)"
          echo "JARSHA:$(sha256sum target/ShrinkRay-1.2.0.jar | cut -d' ' -f1)"
      - name: Compile check against the newest Paper API
        run: mvn -B clean compile -Dpaper.version=${{ env.LATEST_PAPER_API }}

